services:
  family-calendar:
    image: ghcr.io/abateman121/family-calendar:v0.0.22
    container_name: family-calendar
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: "America/Los_Angeles"
      HOST_OS: "Unraid"
      HOST_HOSTNAME: "Tower"
      HOST_CONTAINERNAME: "family-calendar"
    labels:
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:****]/system/status"
      net.unraid.docker.icon: "/mnt/user/icons/family-calendar.png"
      folder.view2: "family-calendar"
    volumes:
      - /mnt/cache/appdata/familycalendar:/app/data