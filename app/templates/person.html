<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select User</title>
</head>
<body>
    <div class="version">v{{ version }}</div>
    <h2>Select User</h2>
    {% for p in persons %}
    <form method="post" action="/verify_pin" style="display: block; margin: 10px;">
        <input type="hidden" name="person_id" value="{{ p.id }}">
        <label>
            PIN:
            <input type="password" name="pin" inputmode="numeric" maxlength="6" required
                   style="width: 80px; margin-left: 5px;">
        </label>
        <button type="submit" class="person-btn" style="background-color: {{ p.color }};">
            {{ p.name[0] }}{% if p.name.split()|length>1 %}{{ p.name.split()[-1][0] }}{% endif %}
        </button>
    </form>
    {% endfor %}
</body>
</html>
